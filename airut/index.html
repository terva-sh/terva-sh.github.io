<!DOCTYPE html>
<!--
  Vanity-import page for airut, the Go framework for Discord and Matrix
  bots whose commands can hand work to a terva agent turn (module
  terva.sh/airut). `go get terva.sh/airut` resolves through the
  go-import meta here; deeper paths such as terva.sh/airut/matrix fall
  to 404.html, which carries the same meta beside the other modules'.
  The go tool ignores a meta whose prefix does not match the path it
  asked for, so they never collide.

  The mirror's default branch is `release`, as terva's is.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="go-import" content="terva.sh/airut git https://github.com/terva-sh/airut">
  <meta name="go-source" content="terva.sh/airut https://github.com/terva-sh/airut https://github.com/terva-sh/airut/tree/release{/dir} https://github.com/terva-sh/airut/blob/release{/dir}/{file}#L{line}">
  <meta http-equiv="refresh" content="0; url=https://github.com/terva-sh/airut">
  <title>terva.sh/airut</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <p>Redirecting to <a href="https://github.com/terva-sh/airut">github.com/terva-sh/airut</a>…</p>
</body>
</html>
