<!DOCTYPE html>
<!--
  Vanity-import page for rihma, the cgo-free Go Matrix library and terva
  connector (module terva.sh/rihma). `go get terva.sh/rihma` resolves
  through the go-import meta here; deeper paths such as
  terva.sh/rihma/cmd/terva-rihma fall to 404.html, which carries the
  same meta beside terva's. The go tool ignores a meta whose prefix does
  not match the path it asked for, so the two never collide.

  The mirror's default branch is `release`, as terva's is.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="go-import" content="terva.sh/rihma git https://github.com/terva-sh/rihma">
  <meta name="go-source" content="terva.sh/rihma https://github.com/terva-sh/rihma https://github.com/terva-sh/rihma/tree/release{/dir} https://github.com/terva-sh/rihma/blob/release{/dir}/{file}#L{line}">
  <meta http-equiv="refresh" content="0; url=https://github.com/terva-sh/rihma">
  <title>terva.sh/rihma</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <p>Redirecting to <a href="https://github.com/terva-sh/rihma">github.com/terva-sh/rihma</a>…</p>
</body>
</html>
