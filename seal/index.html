<!DOCTYPE html>
<!--
  Vanity-import page for seal, the Go module for sealed fields: secret
  configuration values encrypted with age and bound to the key they are
  stored at, in the enc:age:v2 format terva uses (module terva.sh/seal).
  `go get terva.sh/seal` resolves through the go-import meta here; any
  deeper path falls to 404.html, which carries the same meta beside the
  other modules'. The go tool ignores a meta whose prefix does not match
  the path it asked for, so they never collide.

  The mirror's default branch is `release`, as terva's is.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="go-import" content="terva.sh/seal git https://github.com/terva-sh/seal">
  <meta name="go-source" content="terva.sh/seal https://github.com/terva-sh/seal https://github.com/terva-sh/seal/tree/release{/dir} https://github.com/terva-sh/seal/blob/release{/dir}/{file}#L{line}">
  <meta http-equiv="refresh" content="0; url=https://github.com/terva-sh/seal">
  <title>terva.sh/seal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <p>Redirecting to <a href="https://github.com/terva-sh/seal">github.com/terva-sh/seal</a>…</p>
</body>
</html>
